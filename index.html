    <symbol id="px-home" viewBox="0 0 11 11" shape-rendering="crispEdges">
      <path fill="#2b1a14" d="M5 0h1v1H5zM4 1h1v1H4zM6 1h1v1H6zM3 2h1v1H3zM7 2h1v1H7zM2 3h1v1H2zM8 3h1v1H8zM1 4h1v1H1zM9 4h1v1H9zM0 5h1v1H0zM10 5h1v1H10zM1 6h1v1H1zM9 6h1v1H9zM1 7h1v1H1zM9 7h1v1H9zM1 8h1v1H1zM9 8h1v1H9zM1 9h1v1H1zM9 9h1v1H9zM2 10h7v1H2z"/>
      <path fill="#e8352e" d="M5 1h1v1H5zM4 2h3v1H4zM3 3h5v1H3zM2 4h7v1H2z"/>
      <path fill="#b3221c" d="M1 5h9v1H1z"/>
      <path fill="#fff8e1" d="M2 6h7v1H2zM2 7h1v1H2zM5 7h1v1H5zM8 7h1v1H8zM2 8h1v1H2zM5 8h1v1H5zM8 8h1v1H8zM2 9h4v1H2zM8 9h1v1H8z"/>
      <path fill="#bfe8f5" d="M3 7h2v1H3zM3 8h2v1H3z"/>
      <path fill="#9a5b3a" d="M6 7h2v1H6zM6 8h2v1H6zM6 9h2v1H6z"/>

    <symbol id="px-office" viewBox="0 0 11 11" shape-rendering="crispEdges">
      <path fill="#2b1a14" d="M1 0h9v1H1zM0 1h1v1H0zM10 1h1v1H10zM0 2h1v1H0zM10 2h1v1H10zM0 3h1v1H0zM10 3h1v1H10zM0 4h1v1H0zM10 4h1v1H10zM0 5h1v1H0zM10 5h1v1H10zM0 6h1v1H0zM10 6h1v1H10zM0 7h1v1H0zM10 7h1v1H10zM0 8h1v1H0zM10 8h1v1H10zM0 9h1v1H0zM10 9h1v1H10zM1 10h9v1H1z"/>
      <path fill="#6b7a99" d="M1 1h9v1H1zM1 2h1v1H1zM9 2h1v1H9zM1 3h9v1H1zM1 4h1v1H1zM9 4h1v1H9zM1 5h9v1H1zM1 6h1v1H1zM9 6h1v1H9zM1 7h9v1H1zM1 8h1v1H1zM9 8h1v1H9zM1 9h2v1H1zM8 9h2v1H8z"/>

<div class="sky" aria-hidden="true">
  <svg class="cloud c1"><use href="#px-cloud"/></svg>
  <svg class="cloud c2"><use href="#px-cloud"/></svg>
  <svg class="cloud c3"><use href="#px-cloud"/></svg>
</div>

<main id="app">

  <!-- 레벨 · 하트 — 문항 · 결과 화면에서는 맨 위, 첫 화면에서는 노선도 바로 위 -->
  <header id="hud" class="hud">
    <span id="hud-lv" class="hud-lv">LV 1</span>
    <span class="hud-mid">
      <span id="hud-title" class="hud-title">인턴</span>
      <span class="xp"><i id="hud-xp"></i></span>
    </span>
    <span class="hud-hearts"><svg><use href="#px-heart"/></svg><b id="hud-total">0</b></span>
  </header>

  <!-- 주제 고르기 ──────────────────────────────── -->
  <section id="view-home" class="view">
    <p id="shared-banner" class="banner" hidden></p>
    <div class="hero">
      <svg class="tree t-left" aria-hidden="true"><use href="#px-tree"/></svg>
      <svg class="tree t-right" aria-hidden="true"><use href="#px-tree"/></svg>
      <div class="badge-day">PRESS START</div>
      <h1 id="title">굿모닝 노동법!</h1>
      <p id="subtitle" class="muted"></p>
      <p class="lead">
        <svg class="coin" aria-hidden="true"><use href="#px-coin"/></svg>
        스테이지를 골라 5문제를 풀고 하트를 모으세요.
        <svg class="coin" aria-hidden="true"><use href="#px-coin"/></svg>
      </p>
    </div>
    <!-- 첫 화면에서는 레벨 · 하트 줄이 여기(노선도 바로 위)로 옮겨 온다 — app.js show() -->
    <div id="hud-home-slot"></div>
    <!-- 출근길 노선도 — 맞힌 문제(하트) 수만큼 회사원이 집에서 회사 쪽으로 간다 -->
    <div class="commute">
      <div class="commute-head"><span>출근길 노선도</span><span id="commute-note"></span></div>
      <div id="metro" class="metro"></div>
    </div>
    <div id="topic-grid" class="grid"></div>
    <p class="fineprint">모든 정답은 법령 원문에서 직접 뽑았습니다.<br>
      결과 화면의 <b>근거 보기</b>를 누르면 어디서 뽑았는지 나옵니다.</p>
  </section>

  <!-- 문항 ───────────────────────────────────── -->
  <section id="view-quiz" class="view" hidden>
    <button id="btn-back" class="linkish">◀ 출근길로 돌아가기</button>
    <p id="topic-name" class="muted small"></p>
    <div class="stage-bar">
      <p id="q-count" class="muted small"></p>
      <div id="stage-hearts" class="stage-hearts" aria-label="이번 스테이지에서 얻은 하트"></div>
    </div>
    <div class="progress"><div id="progress-bar"></div></div>
    <div class="qbox">
      <h2 id="q-text"></h2>

      <div id="q-choice" class="choices" hidden></div>

      <div id="q-slider" hidden>
        <output id="slider-out" class="slider-out"></output>
        <input type="range" id="slider" aria-label="추측 값">
        <div class="slider-ends"><span id="slider-min"></span><span id="slider-max"></span></div>
      </div>
    </div>

    <button id="btn-next" class="primary" disabled>다음 업무 ▶</button>
  </section>

  <!-- 결과 ───────────────────────────────────── -->
  <section id="view-result" class="view" hidden>
    <p id="result-topic" class="muted small"></p>
    <div class="score-card">
      <div class="stage-clear">STAGE CLEAR</div>
      <div id="grade-emoji" class="grade-emoji"></div>
      <div id="score" class="score"></div>
      <div id="grade" class="grade"></div>
      <div id="heart-gain" class="heart-gain"></div>
    </div>

    <div id="ai-comment" class="ai" hidden></div>

    <div id="cards"></div>

    <div id="caveat" class="caveat" hidden></div>
    <p id="source" class="fineprint"></p>

    <div class="actions">
      <button id="btn-share" class="primary">동료에게 알려주기</button>
      <button id="btn-more" class="ghost">승진하러 가기 ▶</button>
    </div>
  </section>

</main>

<div id="toast" class="toast" hidden aria-live="polite"></div>

<!-- 레벨업 -->
<div id="levelup" class="levelup" hidden role="dialog" aria-label="레벨 업">
  <div class="lu-box">
    <div class="lu-sub">축하합니다! 승진했어요</div>
    <div class="lu-big">LEVEL<br>UP!</div>
    <div id="lu-lv" class="lu-lv"></div>
    <div id="lu-title" class="lu-title"></div>
    <button id="lu-ok" class="primary">다음 승진 도전 ▶</button>
  </div>
</div>

<!-- 출근 완료 — 12개 스테이지를 다 끝내 회사에 도착하면 한 번 터지는 축하 -->
<div id="arrive" class="levelup arrive" hidden role="dialog" aria-label="출근 완료">
  <div id="confetti" class="confetti" aria-hidden="true"></div>
  <div class="lu-box">
    <svg class="arrive-office" aria-hidden="true"><use href="#px-office"/></svg>
    <div class="lu-big">출근<br>완료!</div>
    <div class="lu-sub">12개 스테이지를 모두 끝내고 회사에 도착했어요</div>
    <button id="arrive-ok" class="primary">오늘도 수고했어요 ▶</button>
  </div>
</div>

<div class="ground" aria-hidden="true">
  <div class="crew">
    <svg class="shelter"><use href="#px-shelter"/></svg>
    <svg class="stopsign"><use href="#px-stopsign"/></svg>
    <svg class="worker w1"><use href="#px-hardhat"/></svg>
    <svg class="worker w2"><use href="#px-me"/></svg>
    <svg class="worker w3"><use href="#px-apron"/></svg>
    <svg class="worker w4"><use href="#px-lead"/></svg>
    <svg class="bus"><use href="#px-bus"/></svg>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
